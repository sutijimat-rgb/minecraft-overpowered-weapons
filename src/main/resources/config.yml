# ---------------------------------------------------------------
# SmpWeapons configuration  (/smpweapons reload to apply changes)
# ---------------------------------------------------------------

mace:
  # Left-click in the air hits the first living thing in your crosshair
  # up to this many blocks away ("infinite reach").
  reach: 128.0
  # Damage per reach hit (2 = 1 heart).
  damage: 20.0
  # Milliseconds between reach hits.
  cooldown-ms: 600
  # true = every reach hit counts as a mace smash, so Wind Burst launches you
  # even when you are standing still. false = only after falling 1.5+ blocks.
  reach-always-smash: true
  # If false, the reach hit is blocked by walls.
  through-walls: false
  # Enchantments on the mace (vanilla names, level 0 = skip).
  # Applied when you run /smpweapons give mace.
  enchantments:
    wind_burst: 2
    breach: 4
    density: 5
  # Resistance buff while the mace is ANYWHERE in your inventory and you are "healthy".
  resistance:
    enabled: true
    resistance-level: 4   # 4 = Resistance IV, 5 = Resistance V (full immunity)
    healthy-percent: 0.7  # buff only while health >= 70% of max health (0 = always)

spear:
  # Material name of the spear. Netherite spear exists in 1.21.11.
  material: NETHERITE_SPEAR
  # Adds the vanilla Lunge enchantment at this level (0 = off).
  lunge-level: 3
  # Attribute bonuses while held in the main hand.
  attack-damage-bonus: 12.0
  attack-speed-bonus: 2.0
  movement-speed-scalar: 0.25   # +25% walk speed while held

  # Right-click: custom lunge dash.
  dash:
    power: 3.2
    ticks: 8
    damage: 10.0
    # 0 = no cooldown, spam it as fast as you can right-click.
    cooldown-ms: 0

  # Sneak + right-click: orbital strike cannon (real TNT explosions).
  #   mode: stab = a column of TNT from the sky to the bottom of the world
  #         nuke = rings of TNT falling from the sky onto the target
  orbital-cannon:
    mode: stab
    range: 300.0
    cooldown-seconds: 10
    charge-ticks: 60            # beam charge time before the strike (20 ticks = 1 second)
    blast-power: 5.0            # power of each TNT (vanilla TNT is 4.0, bigger = wider hole)
    stab-spacing: 3             # blocks between TNT in the stab column (bigger = fewer TNT)
    tnt-spawned-per-tick: 20    # how fast the stab column is spawned (lower = less lag)
    nuke-radius: 20.0           # outer ring radius for nuke mode
    # false = TNT hurts players and mobs but does not break blocks.
    break-blocks: true
    # true = the caster takes no damage from their own strike.
    protect-caster: true
