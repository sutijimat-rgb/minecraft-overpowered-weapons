# ---------------------------------------------------------------
# SmpWeapons configuration  (/smpweapons reload to apply changes)
# ---------------------------------------------------------------

mace:
  # Left-click in the air hits the first living thing in your crosshair
  # up to this many blocks away ("infinite reach").
  reach: 128.0
  # Damage per reach hit (2 = 1 heart).
  damage: 20.0
  # Milliseconds between reach hits.
  cooldown-ms: 600
  # true = every reach hit counts as a mace smash, so Wind Burst launches you
  # even when you are standing still. false = only after falling 1.5+ blocks.
  reach-always-smash: true
  # If false, the reach hit is blocked by walls.
  through-walls: false
  # Enchantments on the mace (vanilla names, level 0 = skip).
  # Applied when you run /smpweapons give mace.
  enchantments:
    wind_burst: 2
    breach: 4
    density: 5
  # Resistance buff while the mace is ANYWHERE in your inventory and you are "healthy".
  resistance:
    enabled: true
    resistance-level: 4   # 4 = Resistance IV, 5 = Resistance V (full immunity)
    healthy-percent: 0.7  # buff only while health >= 70% of max health (0 = always)

spear:
  # Material name of the spear. Netherite spear exists in 1.21.11.
  material: NETHERITE_SPEAR
  # Adds the vanilla Lunge enchantment at this level (0 = off).
  lunge-level: 3
  # Attribute bonuses while held in the main hand.
  attack-damage-bonus: 12.0
  attack-speed-bonus: 2.0
  movement-speed-scalar: 0.25   # +25% walk speed while held

  # Right-click: custom lunge dash.
  dash:
    power: 3.2
    ticks: 8
    damage: 10.0
    # 0 = no cooldown, spam it as fast as you can right-click.
    cooldown-ms: 0

  # Orbital strike cannon (real TNT explosions).
  #   Right-click         = lunge dash (see "dash" above)
  #   Shift + right-click = NUKE: rings of TNT falling from the sky onto the target
  #   Shift + left-click  = STAB: a column of TNT from the sky to the bottom of the world
  orbital-cannon:
    range: 300.0
    cooldown:
      stab-seconds: 0             # 0 = no cooldown
      nuke-seconds: 0             # 0 = no cooldown
    stab-charge-ticks: 60         # beam charge time before the stab (20 ticks = 1 second)
    nuke-charge-ticks: 20         # beam charge time before the nuke
    tnt-power: 6.0                # power of each TNT (vanilla TNT is 4.0)
    packed-tnt: 4                 # TNT packed into one spot (more = more damage to entities but MUCH more lag)
    column-spacing: 4             # blocks between TNT spots in the stab column (bigger = less lag)
    spawn-rate: 2                 # TNT spots spawned per tick (lower = less lag, higher = faster strike)
    nuke-radius: 20.0             # outer ring radius of the nuke
    # false = TNT hurts players and mobs but does not break blocks.
    break-blocks: true
    # true = the caster takes no damage from their own strike.
    protect-caster: true

sword:
  # The shit sword (/smpweapons give sword). Not limited; give as many as you like.
  enchants:
    sharpness: 6
    fire_aspect: 3
    looting: 5
    sweeping_edge: 4
    mending: 1
  # Effects while the sword is anywhere in your inventory (0 = off).
  effects:
    speed-level: 3
    strength-level: 3

# ---- The Sift (approximation of Mielon's The Sift) ----
sift:
  enabled: true
  world-name: sift
  rift-seconds: 300
  # true = the goat horn only places the 8 note blocks near an Ancient City portal frame (reinforced deepslate).
  require-ancient-city: true
  # Order to strike the 8 note blocks (positions 1 to 8, left to right) to open the portal.
  portal-sequence: [1, 2, 3, 4, 5, 6, 7, 8]

# ---- Spear and mace SMP rules ----
smp:
  starting-hearts: 10
  max-hearts: 20
  lose-heart-on-any-death: true   # false = only PvP deaths cost a heart
  elimination: spectator          # spectator or ban, used when a player reaches 0 hearts
  revive-hearts: 5
  give-on-first-join: true        # players get a tier 1 sword, mace and spear on first join and after every death
  only-spear-mace: true           # PvP melee only works with spears and maces
  god-tier-kills: 60              # level 14: kills with a tier 13 weapon to earn the God Mace / God Spear
