name: Build plugin jar

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Build
        run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: SmpWeapons-jar
          path: build/libs/SmpWeapons-*.jar
      - name: Publish release with the jar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: SmpWeapons (latest build)
          files: build/libs/SmpWeapons-*.jar
          make_latest: true
